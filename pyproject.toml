[project]
name = "plan10-project"
version = "0.1.0"
requires-python = ">=3.12"  # <--- Forces uv to fetch 3.14-compatible wheels
dependencies = [
    "torch",          
    "torchaudio",
    "torchvision",
    "torchcodec",
    "transformers",
    "bitsandbytes", 
    "opencv-python",
    "uniface",
    "omnivoice",
    "librosa",
    "faster-whisper",
    "spacy_download",
    "fastmcp",
    "num2words",
    "diffsynth @ git+https://github.com/modelscope/DiffSynth-Studio.git",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["plan10"]

[tool.setuptools.package-data]
"data" = ["plan10/system/*.txt"]

[project.scripts]
config = "plan10.lib.config:main"
image_gen = "lib.image_gen:main"
anime_gen = "lib.anime_gen:main"
image_edit = "lib.image_edit:main"
graphics_gen = "plan10.lib.graphics_gen:main"
compositor = "lib.compositor:main"
image_to_video = "lib.image_to_video:main"
scene_analyzer = "lib.scene_analyzer:main"
image_analysis = "lib.image_analysis:main"
captioner = "lib.captioner:main"
video_creator = "emergent.video_creator:main"
video_runner = "emergent.video_runner:main"
bot = "bin.bot:main"
bot_cli = "bin.bot_cli:main"

